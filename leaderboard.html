# The dynamic, auto-sorting Leaderboard page

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <h1>Smiling Sports Day 2026</h1>
        <h3>Leader Board</h3>
        <hr>

        <div id="leaderboard-container">Loading scores...</div>

        <p style="text-align: center; margin-top: 20px;">
            Last updated: <span id="timestamp" style="font-weight: bold; color: #e74c3c;">Never</span>
        </p>
        <a href="index.html" style="display: block; text-align: center; color: #3498db;">← Back Home</a>
    </div>

    <script>
        // Paste your Firebase Config Object from your Firebase Console here
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function fetchAndRenderScores() {
            database.ref('houses').once('value').then((snapshot) => {
                const data = snapshot.val();
                let housesList = [];

                // Format database object into an array for sorting
                for (let houseName in data) {
                    housesList.push({
                        name: houseName,
                        score: parseInt(data[houseName].score) || 0,
                        note: data[houseName].note || "",
                        showNote: data[houseName].showNote || false
                    });
                }

                // Internal sorting algorithm: highest points move to the top
                housesList.sort((a, b) => b.score - a.score);

                // Build the HTML display
                let htmlContent = "";
                housesList.forEach((house, index) => {
                    let noteSpan = (house.showNote && house.note) ? `<span class="note-tag">[${house.note}]</span>` : "";
                    htmlContent += `
                        <div class="house-row position-${index}">
                            <span><strong>Icon ${house.name[0]}</strong> - ${house.name}</span>
                            <span>${house.score} pts ${noteSpan}</span>
                        </div>
                    `;
                });

                document.getElementById('leaderboard-container').innerHTML = htmlContent;
                
                // Track current system execution window time
                const now = new Date();
                document.getElementById('timestamp').innerText = now.toTimeString().split(' ')[0];
            });
        }

        // Run immediately on page load
        fetchAndRenderScores();

        // 3-Minute Refresh Rule Constraint (180,000 milliseconds)
        setInterval(fetchAndRenderScores, 180000);
    </script>
</body>
</html>
